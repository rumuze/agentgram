name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to NPM Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: |
          npm run build
          npm test

      - name: Publish package to NPM
        run: |
          CLEAN_TOKEN=$(node -e "
            const raw = process.env.RAW_NPM_TOKEN || '';
            const match = raw.match(/npm_[A-Za-z0-9_-]+/) || raw.match(/_authToken\s*=\s*([^\s\r\n\"']+)/);
            const token = match ? (match[1] || match[0]) : raw.trim();
            process.stdout.write(token.replace(/[\"'\r\n\s]/g, ''));
          ")
          if [ -z "${CLEAN_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is empty or could not be parsed!"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${CLEAN_TOKEN}" > "${HOME}/.npmrc"
          if [ -n "${NPM_CONFIG_USERCONFIG}" ]; then
            echo "//registry.npmjs.org/:_authToken=${CLEAN_TOKEN}" > "${NPM_CONFIG_USERCONFIG}"
          fi
          NODE_AUTH_TOKEN="${CLEAN_TOKEN}" npm publish --access public
        env:
          RAW_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
